# Myserycord: build all Fluxer service images from this fork and push them to the
# Forgejo container registry. The stack on fluxxer pulls them through
# FLUXER_REGISTRY / FLUXER_IMAGE_TAG in /root/fluxer/.env.
#
# Repo settings needed:
#   secrets.REGISTRY_USER   Forgejo user allowed to write packages for lbxmb
#   secrets.REGISTRY_TOKEN  token of that user with the write:package scope
#   vars.REGISTRY           optional, default 192.168.1.14:3000 (LAN, avoids the
#                           Cloudflare 100 MB request cap on git.lbxmb.fr)
#
# The job runs on the runner's Docker daemon through its socket, so that daemon has to
# list the registry under "insecure-registries" when it is plain HTTP.

name: images

# Only on a new version: push a tag such as v1.0.0, or run it by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: docker:29-cli
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {image: fluxer-api, dockerfile: fluxer_api/Dockerfile}
          - {image: fluxer-app-proxy-self-hosted, dockerfile: fluxer_app_proxy/Dockerfile, args: "--build-arg FLUXER_SELF_HOSTED=true"}
          - {image: fluxer-admin, dockerfile: fluxer_admin/Dockerfile}
          - {image: fluxer-gateway, dockerfile: fluxer_gateway/Dockerfile}
          - {image: fluxer-users, dockerfile: fluxer_users/Dockerfile}
          - {image: fluxer-messages, dockerfile: fluxer_messages/Dockerfile}
          - {image: fluxer-snowflakes, dockerfile: fluxer_snowflakes/Dockerfile}
          - {image: fluxer-push, dockerfile: fluxer_push/Dockerfile}
          - {image: fluxer-media-proxy, dockerfile: fluxer_media_proxy/Dockerfile}
          - {image: fluxer-gifs, dockerfile: fluxer_gifs/Dockerfile}
          - {image: fluxer-unfurl, dockerfile: fluxer_unfurl/Dockerfile}
          - {image: fluxer-static, dockerfile: fluxer_static/Dockerfile}
    env:
      REGISTRY: ${{ vars.REGISTRY || '192.168.1.14:3000' }}
      OWNER: lbxmb
    steps:
      # docker:cli has no node, so actions/checkout cannot run: clone by hand.
      - name: checkout
        run: |
          apk add --no-cache git >/dev/null
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "http://oauth2:${{ github.token }}@${{ vars.GIT_HOST || '192.168.1.14:3000' }}/${{ github.repository }}.git" src
          cd src && git log -1 --oneline

      - name: login
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: build and push ${{ matrix.image }}
        working-directory: src
        run: |
          sha=$(git rev-parse --short=9 HEAD)
          ref="$REGISTRY/$OWNER/${{ matrix.image }}"
          version="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          docker build -f "${{ matrix.dockerfile }}" ${{ matrix.args }} \
            --build-arg BUILD_VERSION="myserycord-${version:-$sha}" \
            --build-arg SOURCE_SHA="$(git rev-parse HEAD)" \
            -t "$ref:$sha" -t "$ref:myserycord" ${version:+-t "$ref:$version"} .
          docker push --all-tags "$ref"
