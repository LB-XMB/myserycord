#!/usr/sbin/nft -f
# Fluxer host firewall. Pas de "flush ruleset" : ça effacerait les règles Docker au reload.
# eth0 = 192.168.1.50 (LAN, web via CT cloudflared 192.168.1.101)
# eth1 = 151.240.100.29 (IP publique, médias LiveKit uniquement)
# Les ports Docker publiés passent par FORWARD après DNAT : ils sont filtrés dans
# la chaîne "forward" ci-dessous (équivalent nftables de DOCKER-USER, priorité < 0
# donc évaluée avant les règles iptables-nft de Docker, et persistante sans dépendre
# de l'ordre de démarrage de Docker).

table inet fluxer_host
delete table inet fluxer_host

table inet fluxer_host {
	chain input {
		type filter hook input priority filter; policy accept;
		# LiveKit via docker-proxy (IPv6) : seulement sur eth1
		iifname != { "eth1", "lo" } tcp dport 7881 drop
		iifname != { "eth1", "lo" } udp dport 7882 drop
		iifname != "eth1" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto icmp accept
		meta l4proto ipv6-icmp accept
		tcp dport 7881 accept
		udp dport 7882 accept
		drop
	}

	chain forward {
		type filter hook forward priority -10; policy accept;
		# Edge Fluxer : seul le CT cloudflared peut joindre 192.168.1.50:8080
		ct direction original ct status dnat ct original ip daddr 192.168.1.50 meta l4proto tcp ct original proto-dst 8080 ip saddr != 192.168.1.101 drop
		# Médias LiveKit : seulement en entrée sur eth1
		ct direction original ct status dnat iifname != "eth1" meta l4proto tcp ct original proto-dst 7881 drop
		ct direction original ct status dnat iifname != "eth1" meta l4proto udp ct original proto-dst 7882 drop
	}

	# Connexions entrées par eth1 : leurs réponses (depuis les conteneurs) sont
	# marquées 0x1 et routées par la table eth1rt (ip rule fwmark 0x1).
	chain eth1mark {
		type filter hook prerouting priority mangle; policy accept;
		iifname "eth1" ct state new ct mark set 0x1
		iifname != "eth1" ct mark 0x1 meta mark set 0x1
	}
}
