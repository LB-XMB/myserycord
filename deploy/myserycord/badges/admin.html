<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badges · Myserycord admin</title>
<style>
	:root { color-scheme: light dark; --bg: #f6f6f7; --card: #fff; --fg: #1d1d1f; --muted: #6b6b73; --line: #e2e2e6; --accent: #4f46e5; --danger: #c0392b; }
	@media (prefers-color-scheme: dark) { :root { --bg: #111214; --card: #1b1c1f; --fg: #ececf1; --muted: #9a9aa4; --line: #2c2d31; --accent: #818cf8; --danger: #ef6b5b; } }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
	header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
	header a { color: var(--accent); text-decoration: none; }
	header .me { margin-left: auto; color: var(--muted); }
	main { max-width: 960px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 20px; }
	section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
	h1 { font-size: 18px; margin: 0; } h2 { font-size: 15px; margin: 0 0 12px; }
	form, .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	input, select, button { font: inherit; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
	input[type=text] { min-width: 180px; flex: 1; }
	button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
	button.ghost { background: none; color: var(--danger); border-color: var(--line); }
	table { width: 100%; border-collapse: collapse; }
	td, th { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
	th { color: var(--muted); font-weight: 500; border-top: 0; }
	.icon { width: 28px; height: 28px; object-fit: contain; vertical-align: middle; }
	.chip { display: inline-flex; align-items: center; gap: 4px; margin: 2px 6px 2px 0; padding: 2px 4px 2px 6px; border: 1px solid var(--line); border-radius: 99px; }
	.chip img { width: 18px; height: 18px; }
	.chip button { padding: 0 6px; background: none; border: 0; color: var(--danger); }
	.muted { color: var(--muted); }
	#msg { min-height: 1.4em; }
	#msg.err { color: var(--danger); }
</style>
</head>
<body>
<header>
	<a href="/admin/">← Panel admin</a>
	<h1>Badges personnalisés</h1>
	<span class="me" id="me"></span>
</header>
<main>
	<div id="msg"></div>
	<section>
		<h2>Créer un badge</h2>
		<form id="create">
			<input type="text" name="name" placeholder="Nom (ex. VIP)" maxlength="64" required>
			<input type="text" name="description" placeholder="Description (optionnelle)" maxlength="200">
			<input type="file" name="icon" accept="image/png,image/webp,image/gif,image/svg+xml" required>
			<button>Créer</button>
		</form>
		<p class="muted">Image carrée, PNG/WebP/GIF/SVG, 256 Ko max. Affichée en 20 px dans les profils.</p>
	</section>
	<section>
		<h2>Badges</h2>
		<table><thead><tr><th></th><th>Nom</th><th>Description</th><th>Porteurs</th><th></th></tr></thead><tbody id="badges"></tbody></table>
	</section>
	<section>
		<h2>Attribuer un badge</h2>
		<form id="search">
			<input type="text" name="q" placeholder="Pseudo, pseudo#0000, ID ou e-mail" required>
			<button>Chercher</button>
		</form>
		<table><tbody id="results"></tbody></table>
	</section>
	<section>
		<h2>Utilisateurs avec badges</h2>
		<table><tbody id="users"></tbody></table>
	</section>
</main>
<script src="/admin/myserycord/admin.js"></script>
</body>
</html>
